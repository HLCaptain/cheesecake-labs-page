name: Routing and metadata contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cf-pages: ["0", "1"]
    env:
      CF_PAGES: ${{ matrix.cf-pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Keep pinned test tooling separate from the application dependency-upgrade PR.
      - name: Install browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/routing-browser" --no-audit --no-fund --package-lock=false @playwright/test@1.61.1
          "$RUNNER_TEMP/routing-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test routes using the existing Playwright configuration
        env:
          NODE_PATH: ${{ runner.temp }}/routing-browser/node_modules
        run: '"$RUNNER_TEMP/routing-browser/node_modules/.bin/playwright" test tests/e2e/routing.spec.cjs --workers=2'
