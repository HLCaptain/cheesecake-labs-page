name: Website CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
      VITE_FORMSPREE_CHEESECAKE_ID: ${{ vars.VITE_FORMSPREE_CHEESECAKE_ID }}
      VITE_FORMSPREE_MINDSHIFT_ID: ${{ vars.VITE_FORMSPREE_MINDSHIFT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require deployment configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for name in VITE_PUBLIC_POSTHOG_KEY VITE_FORMSPREE_CHEESECAKE_ID VITE_FORMSPREE_MINDSHIFT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable $name"
              exit 1
            fi
          done

      - name: Build
        run: npm run build

      - name: Verify configured values in build
        run: |
          for name in VITE_PUBLIC_POSTHOG_KEY VITE_PUBLIC_POSTHOG_HOST VITE_FORMSPREE_CHEESECAKE_ID VITE_FORMSPREE_MINDSHIFT_ID; do
            value="${!name}"
            if [[ -n "$value" ]] && ! grep -rFq -- "$value" dist; then
              echo "::error::$name is configured but missing from dist"
              exit 1
            fi
          done

      - name: Install Chromium
        run: npm run test:e2e:install

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload verified site
        uses: actions/upload-artifact@v7
        with:
          name: website-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy verified site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified site
        uses: actions/download-artifact@v8
        with:
          name: website-${{ github.sha }}
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ''
